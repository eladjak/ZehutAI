[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zehutai"
version = "0.1.0"
description = "Hebrew/multilingual AI text analysis, semantic similarity, and RAG pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Elad Jacobi"},
]
keywords = ["nlp", "hebrew", "embeddings", "rag", "sentence-transformers", "bert"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "nltk>=3.8.0",
    "gensim>=4.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
zehutai = "zehutai.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests that require model downloads (run with: pytest -m slow --override-ini='addopts=')",
    "integration: marks integration tests that require GPU or large models",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
# Yehoshua's original research dir — his working style, not lint-governed
extend-exclude = ["YehoshuaSimilarityComparisons"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "N802",  # function name should be lowercase (project uses camelCase)
    "N806",  # variable in function should be lowercase
    "N803",  # argument name should be lowercase
    "RUF002", # ambiguous-unicode in docstrings — Hebrew NLP project, Hebrew text is intentional
    "RUF003", # ambiguous-unicode in comments — same
]

[tool.coverage.run]
source = ["zehutai"]
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    ".omc/*",
    ".pytest_cache/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
