# Pre-commit hooks configuration for ZehutAI
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files
# Bypass: git commit --no-verify

repos:
  # Standard file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # Ruff: Fast Python linter and formatter (astral.sh)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.8
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Secret scanning: Yelp's detect-secrets
  # Scans for API keys, tokens, passwords, and other sensitive credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        stages: [commit]

  # Custom secret pattern hook (cross-platform Python script)
  # Scans staged file contents for: OpenAI keys, GitHub tokens, Slack tokens,
  # hardcoded password/secret/token assignments
  - repo: local
    hooks:
      - id: detect-secrets-custom
        name: Detect common secret patterns
        entry: python -c "
import re, sys
patterns = [
    r'sk-[a-zA-Z0-9_-]{20,}',
    r'api[_-]?key\\s*[:=]\\s*[\"\\x27][a-zA-Z0-9]',
    r'password\\s*[:=]\\s*[\"\\x27][^\"\\x27]{8,}',
    r'secret\\s*[:=]\\s*[\"\\x27][a-zA-Z0-9]',
    r'token\\s*[:=]\\s*[\"\\x27][a-zA-Z0-9]',
    r'OPENAI_API_KEY\\s*=\\s*[\"\\x27]sk-',
    r'ghp_[a-zA-Z0-9]{36}',
    r'github_pat_[a-zA-Z0-9_]{82}',
    r'xox[bpors]-[a-zA-Z0-9-]+',
]
found = False
for path in sys.argv[1:]:
    try:
        text = open(path, encoding='utf-8', errors='ignore').read()
    except OSError:
        continue
    for pat in patterns:
        if re.search(pat, text, re.IGNORECASE):
            print(f'ERROR: Secret pattern [{pat[:30]}...] in {path}')
            found = True
sys.exit(1 if found else 0)
"
        language: system
        stages: [commit]
        files: '(\.py|\.yaml|\.yml|\.toml|\.sh|\.env)$'
